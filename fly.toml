app = "bubabi"
primary_region = "ams"

[build]

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  PYTHON_VERSION = "3.13.0"
  PORT = "10000"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "bubabi_data"
  destination = "/app/db"
