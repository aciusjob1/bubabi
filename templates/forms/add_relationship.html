{% extends "base.html" %}
{% load i18n %}

{% block page_title %}{% trans "Add Relationship" %}{% endblock %}

{% block content %}

<div style="max-width:560px; margin:0 auto;">

  <div class="section-title">🔗 {% trans "Add Family Relationship" %}</div>

  <div style="background:#fff; border-radius:12px; border:1px solid #e2e8f0; padding:1.5rem;">

    <form method="post">
      {% csrf_token %}

      <!-- From Person -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.4rem;">
          👤 {% trans "Person" %} *
        </label>
        <select name="from_person" required style="width:100%; padding:0.7rem; border:1px solid #e2e8f0; border-radius:8px; font-size:0.9rem; background:#fff;">
          <option value="">— {% trans "Select person" %} —</option>
          {% for p in persons %}
          <option value="{{ p.id }}">{{ p.full_name }} ({{ p.gender|title }})</option>
          {% endfor %}
        </select>
      </div>

      <!-- Relationship Type -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.4rem;">
          🔗 {% trans "Relationship" %} *
        </label>
        <select name="relation_type" required style="width:100%; padding:0.7rem; border:1px solid #e2e8f0; border-radius:8px; font-size:0.9rem; background:#fff;">
          <option value="">— {% trans "Select relationship" %} —</option>
          {% for key, label in relation_types %}
          <option value="{{ key }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- To Person -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.4rem;">
          👤 {% trans "Related To" %} *
        </label>
        <select name="to_person" required style="width:100%; padding:0.7rem; border:1px solid #e2e8f0; border-radius:8px; font-size:0.9rem; background:#fff;">
          <option value="">— {% trans "Select person" %} —</option>
          {% for p in persons %}
          <option value="{{ p.id }}">{{ p.full_name }} ({{ p.gender|title }})</option>
          {% endfor %}
        </select>
      </div>

      <!-- Biological -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
          <input type="checkbox" name="is_biological" checked style="accent-color:#10b981; width:16px; height:16px;">
          <span style="font-size:0.85rem; color:#374151;">{% trans "Biological relationship" %}</span>
        </label>
      </div>

      <!-- Notes -->
      <div style="margin-bottom:1.5rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:0.4rem;">
          📝 {% trans "Notes" %}
        </label>
        <textarea name="notes" rows="2" placeholder="{% trans 'Optional notes...' %}" style="width:100%; padding:0.7rem; border:1px solid #e2e8f0; border-radius:8px; font-size:0.85rem; resize:vertical;"></textarea>
      </div>

      <!-- Buttons -->
      <div style="display:flex; gap:0.75rem; justify-content:flex-end;">
        <a href="{% url 'family-tree' %}" style="padding:0.6rem 1.5rem; background:#f1f5f9; color:#374151; border-radius:8px; font-size:0.85rem; font-weight:600; text-decoration:none;">{% trans "Cancel" %}</a>
        <button type="submit" style="padding:0.6rem 1.5rem; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:0.85rem; font-weight:600; cursor:pointer;">🔗 {% trans "Add Relationship" %}</button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
