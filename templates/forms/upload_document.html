{% extends "base.html" %}
{% load i18n %}

{% block page_title %}{% trans "Upload Document" %}{% endblock %}

{% block content %}
<div style="max-width:560px; margin:0 auto;">
  <div class="section-title">📄 {% trans "Upload Clan Document" %}</div>
  <div style="background:#fff; border-radius:12px; border:1px solid #e2e8f0; padding:1.5rem;">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      
      <!-- Title -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; margin-bottom:0.4rem;">{% trans "Title" %} *</label>
        <input type="text" name="title" required placeholder="{% trans 'Document title' %}" style="width:100%; padding:0.7rem; border:1px solid #e2e8f0; border-radius:8px; font-size:0.9rem; outline:none;">
      </div>
      
      <!-- Type -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; margin-bottom:0.4rem;">{% trans "Type" %}</label>
        <select name="document_type" style="width:100%; padding:0.7rem; border:1px solid #e2e8f0; border-radius:8px; font-size:0.9rem; background:#fff; cursor:pointer;">
          {% for key, label in document_types %}
          <option value="{{ key }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      
      <!-- Description -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; margin-bottom:0.4rem;">{% trans "Description (optional)" %}</label>
        <textarea name="description" rows="2" placeholder="{% trans 'Brief description of this document...' %}" style="width:100%; padding:0.7rem; border:1px solid #e2e8f0; border-radius:8px; font-size:0.9rem; outline:none; resize:vertical; font-family:inherit;"></textarea>
      </div>
      
      <!-- Version -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; margin-bottom:0.4rem;">{% trans "Version" %}</label>
        <input type="text" name="version" value="1.0" placeholder="1.0" style="width:100%; padding:0.7rem; border:1px solid #e2e8f0; border-radius:8px; font-size:0.9rem; outline:none;">
      </div>
      
      <!-- File -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:block; font-size:0.75rem; font-weight:600; color:#374151; text-transform:uppercase; margin-bottom:0.4rem;">{% trans "File" %} *</label>
        <input type="file" name="file" required 
               accept=".pdf,.doc,.docx,.txt,.rtf,.odt,.jpg,.jpeg,.png,.xls,.xlsx,.ppt,.pptx,.csv"
               style="width:100%; padding:0.5rem; border:2px dashed #e2e8f0; border-radius:8px; background:#f8fafc;">
        <div style="font-size:0.7rem; color:#64748b; margin-top:0.25rem;">{% trans "Accepted: PDF, Word, Excel, PowerPoint, Text, Images" %}</div>
      </div>
      
      <!-- Visibility -->
      <div style="margin-bottom:1.25rem;">
        <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
          <input type="checkbox" name="is_public" checked style="accent-color:#10b981; width:16px; height:16px;">
          <span style="font-size:0.85rem;">{% trans "Visible to all members" %}</span>
        </label>
      </div>
      
      <button type="submit" style="width:100%; padding:0.85rem; background:var(--primary); color:#fff; border:none; border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer;">📤 {% trans "Upload Document" %}</button>
    </form>
  </div>
</div>
{% endblock %}
